services:
  - type: web
    name: rlt-agent-dashboard-api
    env: node
    region: oregon
    plan: free
    buildCommand: cd backend && npm install && npm run build
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        sync: false  # Will add manually after PostgreSQL is created

databases:
  - name: rlt-agent-dashboard-db
    databaseName: agent_dashboard
    user: dashboard_user
    plan: free
